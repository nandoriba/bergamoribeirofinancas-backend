# /etc/nginx/sites-available/bergamoribeirofinancas.conf
# Reverse proxy TLS para o sistema financeiro.

server {
    listen 80;
    listen [::]:80;
    server_name bergamoribeirofinancas.com.br api.bergamoribeirofinancas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Webhooks são aceitos somente por HTTPS. Não registre o secret nem o
    # devolva em um redirect caso alguém configure acidentalmente uma URL HTTP.
    location = /payments/webhooks/abacatepay {
        access_log off;
        error_log /dev/null crit;
        return 404;
    }

    location ^~ /payments/webhooks/abacatepay/ {
        access_log off;
        error_log /dev/null crit;
        return 404;
    }

    # O primeiro acesso ao convite carrega um bearer token no path. Suprima o
    # access log também no redirect HTTP para não persistir essa credencial.
    location ^~ /convite/ {
        access_log off;
        error_log /dev/null crit;
        return 301 https://bergamoribeirofinancas.com.br$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bergamoribeirofinancas.com.br;

    ssl_certificate /etc/letsencrypt/live/bergamoribeirofinancas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bergamoribeirofinancas.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # O callback carrega code/state na query. Não grave a request URI em access logs.
    location = /auth/google/callback {
        access_log off;
        # Erros de upstream também podem incluir a request completa, com a query sensível.
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # O link de recuperação carrega um segredo de uso único na query. Não o registre.
    location = /auth/password-reset/continue {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # A AbacatePay envia webhookSecret na query. Nunca grave URI, assinatura ou corpo.
    location = /payments/webhooks/abacatepay {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # O roteamento do Nest aceita barra final. Rejeite qualquer variante sem
    # registrar a query, para que um webhook mal cadastrado não exponha o secret.
    location ^~ /payments/webhooks/abacatepay/ {
        access_log off;
        error_log /dev/null crit;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bergamoribeirofinancas.com.br;

    ssl_certificate /etc/letsencrypt/live/bergamoribeirofinancas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bergamoribeirofinancas.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # O token do convite existe apenas no primeiro path carregado pelo SPA.
    # Nunca o persista no access log do proxy web.
    location ^~ /convite/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
