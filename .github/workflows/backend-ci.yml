name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bergamoribeirofinancas-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bergamoribeirofinancas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bergamoribeirofinancas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bergamoribeirofinancas_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bergamoribeirofinancas_test?schema=public
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      NODE_ENV: test
      WEB_ORIGIN: http://127.0.0.1:8181
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: PostgreSQL integration tests
        run: npm run test:integration

  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: meta
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/bergamoribeirofinancas-backend" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diretório isolado na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: VPS_APP_DIR
          script: |
            set -eu
            if [ "$VPS_APP_DIR" != "/app/financeiro" ]; then
              echo "VPS_APP_DIR deve ser /app/financeiro para não sobrescrever a stack do Psicocomportamento."
              exit 1
            fi
            mkdir -p "$VPS_APP_DIR"

      - name: Copiar docker-compose para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.VPS_APP_DIR }}
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: BACKEND_TAG,GHCR_USERNAME,GHCR_PAT,VPS_APP_DIR
          script: |
            set -eu
            if [ "$VPS_APP_DIR" != "/app/financeiro" ]; then
              echo "VPS_APP_DIR deve ser /app/financeiro para não sobrescrever a stack do Psicocomportamento."
              exit 1
            fi
            cd "$VPS_APP_DIR"
            if [ ! -f .env ]; then
              echo "Arquivo $VPS_APP_DIR/.env não encontrado. Provisione o .env de produção antes do deploy."
              exit 1
            fi
            if [ ! -f docker-compose.yml ]; then
              echo "Arquivo $VPS_APP_DIR/docker-compose.yml não encontrado."
              exit 1
            fi
            if ! grep -q '^DATABASE_URL=' .env; then
              echo "DATABASE_URL não encontrado em $VPS_APP_DIR/.env."
              exit 1
            fi
            docker network inspect app_internal > /dev/null
            docker inspect postgres_db > /dev/null
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${BACKEND_TAG}/" .env
            else
              printf '\nBACKEND_TAG=%s\n' "${BACKEND_TAG}" >> .env
            fi
            docker compose -p financeiro -f "$VPS_APP_DIR/docker-compose.yml" pull backend
            docker compose -p financeiro -f "$VPS_APP_DIR/docker-compose.yml" up -d backend
            sleep 10
            curl -fsS http://127.0.0.1:8180/health > /dev/null
            docker image prune -f
