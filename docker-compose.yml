services:
  postgres:
    image: postgres:16-alpine
    container_name: financas-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend:
    image: ghcr.io/${GHCR_OWNER}/bergamoribeirofinancas-backend:${BACKEND_TAG:-latest}
    container_name: financas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8180
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - "127.0.0.1:8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/${GHCR_OWNER}/bergamoribeirofinancas-frontend:${FRONTEND_TAG:-latest}
    container_name: financas-frontend
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:8181:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
