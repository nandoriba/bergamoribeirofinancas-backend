services:
  backend:
    # Telegram usa fila serial em memória no MVP: mantenha exatamente uma réplica.
    image: ghcr.io/${GHCR_OWNER}/bergamoribeirofinancas-backend:${BACKEND_TAG:-latest}
    container_name: financeiro-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8180
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      - app_internal
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/${GHCR_OWNER}/bergamoribeirofinancas-frontend:${FRONTEND_TAG:-latest}
    container_name: financeiro-web
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:8181:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - app_internal
    security_opt:
      - no-new-privileges:true

networks:
  app_internal:
    external: true
